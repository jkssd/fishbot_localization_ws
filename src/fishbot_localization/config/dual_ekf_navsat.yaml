### robot_localization 双 EKF + navsat 配置（GPS 全局定位）
###
### 三个节点（对应三个同名 section）：
###   1. ekf_filter_node_odom  局部 EKF：融合 /odom + /imu，发布 odom -> base_footprint
###   2. ekf_filter_node_map   全局 EKF：融合 /odom(速度) + /imu + /odometry/gps，发布 map -> odom
###   3. navsat_transform      把 GPS(lat/lon) 转成全局坐标，发布 /odometry/gps
###
### 15 个布尔值依次对应：x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az

ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true          # 发布 odom -> base_footprint
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom         # 局部融合，世界坐标系为 odom

    # 轮式里程计：提供 x, y, yaw 以及 vx, vy, vyaw
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true

    # IMU：提供 yaw 与 vyaw
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: false

ekf_filter_node_map:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true          # 发布 map -> odom
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map          # 全局融合，世界坐标系为 map

    # 轮式里程计：只用速度(vx, vy, vyaw)，避免与 GPS 绝对位姿冲突
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true

    # GPS 转换后的全局位置（由 navsat_transform 发布）：提供 x, y
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true

    # IMU：提供 yaw 与 vyaw
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: true

navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    delay: 3.0
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true
    broadcast_utm_transform: false
    publish_filtered_gps: true
    use_odometry_yaw: true    # 航向直接取 EKF 里程计的 yaw，避免磁偏角/偏移标定
    wait_for_datum: false     # 用第一帧 GPS 作为原点，机器人起始位置即 map 原点(0,0)
