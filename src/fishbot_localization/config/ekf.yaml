ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    transform_tolerance: 1.0          # 关键！增大容差，减少时间不同步导致的丢帧

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # 轮式里程计：只融合速度，不融合位置
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,   # 只融合 vx
                   false, false, true,    # 只融合 vyaw
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # IMU：只融合角速度，不融合绝对yaw
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,   # 不融合绝对yaw
                  false, false, false,
                  false, false, true,    # 只融合 vyaw
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: true               # 仿真中建议改为true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true