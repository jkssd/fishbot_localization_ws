### robot_localization 双 EKF + navsat（GNSS/RTK 全局定位）配置
###
### 三个节点（对应三个同名 section）：
###   1. ekf_filter_node_odom  局部 EKF：融合 /odom(轮式里程计) + /imu，发布 odom -> base_footprint
###   2. ekf_filter_node_map   全局 EKF：融合 /odom(速度) + /imu(航向) + /odometry/gps(绝对位置)，发布 map -> odom
###   3. navsat_transform      把 /gps/rtk_fix 的经纬度转成 map 系坐标，发布 /odometry/gps
###
### 坐标系链：map -> odom -> base_footprint -> base_link -> (传感器)
###
### 15 个布尔值依次对应：x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az

ekf_filter_node_odom:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true            # 地面机器人，忽略 z/roll/pitch
    publish_tf: true            # 发布 odom -> base_footprint
    publish_acceleration: false
    print_diagnostics: true
    transform_time_offset: 0.0
    transform_timeout: 0.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom           # 局部融合，世界坐标系为 odom

    # 轮式里程计：融合 x, y, yaw 位置 + vx, vy, vyaw 速度
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # IMU：融合 yaw 绝对航向 + vyaw 角速度
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true


ekf_filter_node_map:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true            # 发布 map -> odom
    publish_acceleration: false
    print_diagnostics: true
    transform_time_offset: 0.0
    transform_timeout: 0.0

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map            # 全局融合，世界坐标系为 map

    # 轮式里程计：只融合速度(vx, vy, vyaw)，避免与 GPS 绝对位置冲突
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # GPS 转换后的全局位置（由 navsat_transform 发布）：融合 x, y 绝对位置
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false

    # IMU：融合 yaw 绝对航向 + vyaw 角速度
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true


navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    delay: 3.0                  # 等待 map->odom 变换稳定后再计算 datum
    magnetic_declination_radians: 0.0   # 使用 use_odometry_yaw 时忽略
    yaw_offset: 0.0             # 使用 use_odometry_yaw 时忽略
    zero_altitude: true         # 地面机器人，忽略高度
    broadcast_utm_transform: false
    publish_filtered_gps: true  # 发布 /gps/filtered（滤波后经纬度，便于可视化）
    use_odometry_yaw: true      # 航向直接取全局 EKF 的 yaw，避免磁偏角标定

    # 显式设置 datum 为 Gazebo 世界原点的经纬度（custom_room.world 的 spherical_coordinates）。
    # 这样 GPS 经纬度会相对该原点换算，机器人起点即 map 系原点 (0,0)。
    # 注意：不要依赖 wait_for_datum 自动取第一帧 GPS 作为原点——在双 EKF + use_odometry_yaw
    # 场景下该自动检测常失败，导致 datum 退化为 (0,0,0)，机器人被换算到 UTM 大坐标（约 188 km 偏移）。
    datum: [31.2304, 121.4737, 0.0]
    wait_for_datum: false

    # RTK 精度由 navsat_rtk_driver 节点写入 /gps/rtk_fix 的 position_covariance，
    # navsat_transform 会把它转发到 /odometry/gps，全局 EKF 据此信任 GNSS。
    # （Humble 的 navsat_transform 没有 use_fixed_covariance 参数，故不在此配置。）
